<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EdwinPAI</title>
    <meta
      name="description"
      content="EdwinPAI is a personal AI assistant you run on your own devices."
    />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #050816;
        color: #eef2ff;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(89, 130, 246, 0.25), transparent 28rem),
          radial-gradient(circle at 80% 30%, rgba(20, 184, 166, 0.18), transparent 26rem), #050816;
      }
      main {
        width: min(880px, calc(100vw - 40px));
        padding: 56px 0;
      }
      .card {
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 28px;
        padding: clamp(28px, 6vw, 64px);
        background: rgba(15, 23, 42, 0.72);
        box-shadow: 0 24px 90px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
      }
      h1 {
        margin: 0 0 18px;
        font-size: clamp(44px, 9vw, 88px);
        line-height: 0.95;
        letter-spacing: -0.07em;
      }
      p {
        max-width: 680px;
        color: #cbd5e1;
        font-size: clamp(18px, 2.3vw, 23px);
        line-height: 1.55;
      }
      code {
        display: block;
        overflow-x: auto;
        margin: 28px 0;
        padding: 18px 20px;
        border-radius: 16px;
        background: rgba(2, 6, 23, 0.88);
        color: #bfdbfe;
        font-size: 16px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      a {
        color: inherit;
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 999px;
        padding: 12px 18px;
        text-decoration: none;
        background: rgba(59, 130, 246, 0.16);
      }
      .button.primary {
        background: #eef2ff;
        color: #0f172a;
        border-color: #eef2ff;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>EdwinPAI</h1>
        <p>
          A personal AI assistant you run on your own devices — with durable memory, workflows,
          tools, channels, and local-first control.
        </p>
        <code>npm install -g @edwinpai/edwinpai@beta<br />edwinpai onboard --install-daemon</code>
        <div class="links">
          <a class="button primary" href="https://docs.edwinpai.com/start/getting-started"
            >Get started</a
          >
          <a class="button" href="https://docs.edwinpai.com">Docs</a>
          <a class="button" href="https://discord.gg/clawd">Discord</a>
          <a class="button" href="/install.sh">Installer script</a>
        </div>
      </section>
    </main>
  </body>
</html>
